name: Building Application

on:
  push:
    branches:
      - 'main'
  pull_request:
    branches:
      - '**'

jobs:
  repository-hygiene:
    runs-on: ubuntu-latest
    name: Repository hygiene
    steps:
      - uses: actions/checkout@v4
      - name: Reject generated and oversized tracked files
        run: bash scripts/check_repository_hygiene.sh
      - name: Test repository hygiene policy
        run: bash scripts/test_repository_hygiene.sh

  engine:
    runs-on: ubuntu-latest
    name: Engine tests and CLI distribution
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Setup environment
        uses: ./.github/actions/setup-gradle
        with:
          gradle-cache-encryption-key: ${{ secrets.GRADLE_CACHE_ENCRYPTION_KEY }}

      # Provider-backed tests are opt-in and stay skipped without explicit live flags and keys.
      - name: Run provider-free engine suites
        run: >
          ./gradlew --continue --no-configuration-cache
          :engine:core:test :engine:substrate:test :engine:sandbox:test
          :engine:agents:test :engine:orchestration:test :engine:competition:test
          :engine:api:test :engine:runtime:test :engine:cli:test

      - name: Assemble CLI distribution
        run: ./gradlew --no-configuration-cache :engine:cli:installDist

      - name: Smoke-test generated launcher
        run: ./evomolior/cli/build/install/evomolior/bin/evomolior --help

      - name: Upload test reports
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: engine-test-reports
          retention-days: 7
          path: evomolior/*/build/reports/tests/

  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: Android
            build_command: ./gradlew assembleDebug
            artifact_path: composeApp/build/outputs/apk/debug/**.apk
            artifact_name: android-debug-apk
            upload_artifact: true
          - os: macos-latest
            platform: iOS
            build_command: |
              gem install cocoapods
              cd iosApp
              pod install --repo-update
              xcodebuild \
                -workspace iosApp.xcworkspace \
                -configuration Debug \
                -scheme iosApp \
                -destination 'platform=iOS Simulator,name=iPhone 14' CODE_SIGNING_ALLOWED='NO'
            upload_artifact: false
    runs-on: ${{ matrix.os }}
    name: Build ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup environment
        uses: ./.github/actions/setup-gradle
        with:
          gradle-cache-encryption-key: ${{ secrets.GRADLE_CACHE_ENCRYPTION_KEY }}

      - name: Write secrets to local.properties
        run: |
          echo "GOOGLE_WEB_CLIENT_ID=${{ secrets.GOOGLE_WEB_CLIENT_ID }}" >> "local.properties"
          echo "REVENUECAT_ANDROID_API_KEY=${{ secrets.REVENUECAT_ANDROID_API_KEY }}" >> "local.properties"
          echo "REVENUECAT_IOS_API_KEY=${{ secrets.REVENUECAT_IOS_API_KEY }}" >> "local.properties"

      - name: Build ${{ matrix.platform }} App
        run: ${{ matrix.build_command }}

      - name: Upload ${{ matrix.platform }} Artifact
        if: ${{ matrix.upload_artifact }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          retention-days: 7
          path: ${{ matrix.artifact_path }}

  scan-run-logs:
    runs-on: ubuntu-latest
    name: Scan run logs
    needs: build

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup environment
        uses: ./.github/actions/setup-gradle
        with:
          gradle-cache-encryption-key: ${{ secrets.GRADLE_CACHE_ENCRYPTION_KEY }}

      - name: Generate log artifact
        run: ./gradlew :engine:api:test --tests com.achulkov.evomolior.api.service.RunLogSignatureScannerTest --console=plain > "$RUNNER_TEMP/evomolior-run.log" 2>&1

      - name: Scan run log signatures
        run: ./gradlew :engine:api:scanRunLogSignatures -PrunLogPath="$RUNNER_TEMP/evomolior-run.log"
