<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">EvoMolior hackathon thumbnail</title>
  <desc id="desc">Two glowing agent societies feed reviewed knowledge into a persistent central core. Text reads Agents die. Knowledge compounds.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050b18"/>
      <stop offset=".55" stop-color="#0c1730"/>
      <stop offset="1" stop-color="#111a3d"/>
    </linearGradient>
    <radialGradient id="core">
      <stop offset="0" stop-color="#b8f7ff"/>
      <stop offset=".35" stop-color="#36d7ff"/>
      <stop offset="1" stop-color="#755cff"/>
    </radialGradient>
    <linearGradient id="left" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#23e0ad"/>
      <stop offset="1" stop-color="#1d92c6"/>
    </linearGradient>
    <linearGradient id="right" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a36cff"/>
      <stop offset="1" stop-color="#ff6eb4"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="13" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .brand{font:700 22px Inter,Arial,sans-serif;fill:#8ceeff;letter-spacing:4px}
      .hero{font:800 58px Inter,Arial,sans-serif;fill:#f8fbff;letter-spacing:-1.5px}
      .sub{font:500 20px Inter,Arial,sans-serif;fill:#aabbd8}
      .nodeText{font:700 13px Inter,Arial,sans-serif;fill:#f7fbff}
    </style>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <circle cx="90" cy="710" r="300" fill="#23e0ad" opacity=".055"/>
  <circle cx="1210" cy="10" r="330" fill="#8a5cff" opacity=".07"/>

  <text x="72" y="76" class="brand">EVOMOLIOR · QWEN CLOUD AGENT SOCIETY</text>
  <text x="72" y="585" class="hero">Agents die.</text>
  <text x="72" y="648" class="hero">Knowledge compounds.</text>
  <text x="874" y="650" class="sub">Auditable collective intelligence</text>

  <!-- graph lines -->
  <g opacity=".72" stroke-width="3" fill="none">
    <path d="M220 210 L520 330" stroke="#36d7b4"/>
    <path d="M175 320 L520 350" stroke="#36d7b4"/>
    <path d="M280 420 L530 375" stroke="#36d7b4"/>
    <path d="M1040 190 L750 330" stroke="#b77bff"/>
    <path d="M1110 315 L760 352" stroke="#d274e8"/>
    <path d="M1005 430 L750 378" stroke="#f176bd"/>
    <path d="M632 270 L632 150" stroke="#6edfff"/>
    <path d="M632 430 L632 500" stroke="#6edfff"/>
  </g>

  <!-- left society -->
  <g filter="url(#glow)">
    <circle cx="220" cy="210" r="43" fill="url(#left)"/>
    <circle cx="175" cy="320" r="34" fill="url(#left)"/>
    <circle cx="280" cy="420" r="39" fill="url(#left)"/>
  </g>
  <text x="190" y="215" class="nodeText">RESEARCH</text>
  <text x="148" y="325" class="nodeText">BUILD</text>
  <text x="255" y="425" class="nodeText">CRITIC</text>

  <!-- right society -->
  <g filter="url(#glow)">
    <circle cx="1040" cy="190" r="41" fill="url(#right)"/>
    <circle cx="1110" cy="315" r="36" fill="url(#right)"/>
    <circle cx="1005" cy="430" r="40" fill="url(#right)"/>
  </g>
  <text x="1015" y="195" class="nodeText">OUTLIER</text>
  <text x="1082" y="320" class="nodeText">GRADE</text>
  <text x="976" y="435" class="nodeText">ARCHIVE</text>

  <!-- persistent core -->
  <g filter="url(#glow)">
    <circle cx="640" cy="354" r="116" fill="none" stroke="#5e79d9" stroke-width="2" opacity=".55"/>
    <circle cx="640" cy="354" r="88" fill="url(#core)"/>
    <circle cx="640" cy="354" r="57" fill="#07101f" opacity=".8"/>
  </g>
  <text x="611" y="374" font-family="Inter,Arial,sans-serif" font-size="65" font-weight="800" fill="#f8fbff">E</text>
  <text x="565" y="218" class="brand" font-size="15">PERSISTENT SUBSTRATE</text>
  <g fill="#99dcff">
    <circle cx="632" cy="150" r="9"/>
    <circle cx="632" cy="500" r="9"/>
    <circle cx="520" cy="330" r="8"/>
    <circle cx="530" cy="375" r="8"/>
    <circle cx="750" cy="330" r="8"/>
    <circle cx="750" cy="378" r="8"/>
  </g>
</svg>
