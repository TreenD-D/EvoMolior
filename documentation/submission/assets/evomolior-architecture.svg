  </g>
  <text x="98" y="662" class="small">Redacted WorkerView · staged contributions · round feedback</text>

  <rect x="612" y="510" width="504" height="176" rx="22" fill="#14223d" stroke="#5878bf" stroke-width="1.7" filter="url(#shadow)"/>
  <text x="638" y="541" class="h">Worker society B</text>
  <text x="985" y="541" class="tiny">ISOLATED SQLITE</text>
  <g>
    <rect x="638" y="560" width="104" height="32" rx="10" fill="#253555"/><text x="656" y="581" class="label">Researcher</text>
    <rect x="752" y="560" width="92" height="32" rx="10" fill="#253555"/><text x="773" y="581" class="label">Builder</text>
    <rect x="854" y="560" width="91" height="32" rx="10" fill="#253555"/><text x="875" y="581" class="label">Critic</text>
