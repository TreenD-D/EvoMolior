  <text x="1044" y="419" class="small">Mapped worker nodes · receiver obligations · hidden-test design</text>

  <rect x="1548" y="364" width="286" height="78" rx="18" fill="#2e2923" stroke="#cf9e56" stroke-width="1.6"/>
