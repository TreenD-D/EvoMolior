<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">EvoMolior layered agent-society architecture</title>
  <desc id="desc">A five-layer view of EvoMolior's Qwen Cloud submission route. Operator interfaces create a run envelope for a fail-closed Genesis Council, which uses the selected model backend and compiles separate Worker and Grader authority. Competing worker societies run short-lived specialist agents over isolated durable substrates, while separate grader societies score exact evidence. Capture, disclosure, final-output validation, metrics, replay, and hash-linked archives gate publication.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050b16"/>
      <stop offset=".52" stop-color="#09152b"/>
      <stop offset="1" stop-color="#101939"/>
    </linearGradient>
    <linearGradient id="qwen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9a72ff"/>
      <stop offset=".52" stop-color="#5e8cff"/>
      <stop offset="1" stop-color="#43e2ff"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4be0b4"/>
      <stop offset="1" stop-color="#21a7b5"/>
    </linearGradient>
    <linearGradient id="pink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f18acb"/>
      <stop offset="1" stop-color="#9a72ff"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd17a"/>
      <stop offset="1" stop-color="#ff8e68"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000" flood-opacity=".34"/>
    </filter>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#8097bd"/>
    </marker>
    <marker id="arrowTeal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#48dcb3"/>
    </marker>
    <marker id="arrowPink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#e78ac9"/>
    </marker>
    <style>
      .title{font:800 44px Inter,Arial,sans-serif;fill:#f7f9ff;letter-spacing:-1.2px}
      .subtitle{font:400 18px Inter,Arial,sans-serif;fill:#9fb1d0}
      .eyebrow{font:800 12px Inter,Arial,sans-serif;fill:#79e9ff;letter-spacing:2.2px}
      .layerNo{font:800 12px Inter,Arial,sans-serif;fill:#07101d}
      .layerTitle{font:800 13px Inter,Arial,sans-serif;fill:#d8e5fb;letter-spacing:1.5px}
      .h{font:750 18px Inter,Arial,sans-serif;fill:#f6f8ff}
      .label{font:650 14px Inter,Arial,sans-serif;fill:#e8efff}
      .small{font:400 12.5px Inter,Arial,sans-serif;fill:#aabbd8}
      .tiny{font:700 10px Inter,Arial,sans-serif;fill:#8fa4c7;letter-spacing:.7px}
      .micro{font:600 9px Inter,Arial,sans-serif;fill:#8398ba;letter-spacing:.25px}
      .card{fill:#101d34;stroke:#2a4365;stroke-width:1.4}
      .soft{fill:#0d192e;stroke:#263b59;stroke-width:1.2}
      .flow{fill:none;stroke:#8097bd;stroke-width:2.1;marker-end:url(#arrow)}
      .tealFlow{fill:none;stroke:#48dcb3;stroke-width:2.1;marker-end:url(#arrowTeal)}
      .pinkFlow{fill:none;stroke:#e78ac9;stroke-width:2.1;marker-end:url(#arrowPink)}
      .modelFlow{fill:none;stroke:#7c7dff;stroke-width:1.6;stroke-dasharray:6 7;marker-end:url(#arrow)}
      .biFlow{fill:none;stroke:#8097bd;stroke-width:2.1;marker-start:url(#arrow);marker-end:url(#arrow)}
      .feedback{fill:none;stroke:#d1a75c;stroke-width:1.7;stroke-dasharray:7 7;marker-end:url(#arrow)}
      .boundary{fill:none;stroke:#52698b;stroke-width:1.4;stroke-dasharray:7 8}
    </style>
  </defs>

  <rect width="1920" height="1080" fill="url(#background)"/>
  <circle cx="1760" cy="40" r="340" fill="#8b70ff" opacity=".075"/>
  <circle cx="70" cy="1020" r="340" fill="#35d9a6" opacity=".055"/>

  <text x="56" y="45" class="eyebrow">QWEN CLOUD · AGENT SOCIETY · LAYERED SYSTEM VIEW</text>
  <text x="56" y="91" class="title">EvoMolior: authority before autonomy</text>
  <text x="56" y="121" class="subtitle">Short-lived specialists collaborate and compete; durable evidence, reviewed knowledge, and exact lineage survive them.</text>

  <rect x="52" y="149" width="1816" height="858" rx="26" class="boundary"/>
  <rect x="76" y="137" width="492" height="26" rx="13" fill="#101e37" stroke="#52698b"/>
  <text x="94" y="155" class="tiny">HACKATHON TARGET TOPOLOGY · APP ON ALIBABA CLOUD · OPERATOR ACTION</text>

