  <rect x="252" y="383" width="94" height="24" rx="12" fill="#183e41"/><text x="269" y="400" class="tiny">WORKER VIEW</text>
  <text x="370" y="394" class="h">Worker Node Atlas</text>
  <text x="370" y="419" class="small">Task policy · evidence/capture rules · execution projections · lineage</text>

